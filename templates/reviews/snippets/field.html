<fieldset class="fieldset">
    <label class="label font-semibold text-base-content" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <div id="{{ field.auto_id }}_helptext" class="label whitespace-normal text-base-content">{{ field.help_text|safe }}</div>
    {% endif %}
    {% if field.errors %}
        <div role="alert">{{ field.errors }}</div>
    {% endif %}
</fieldset>
