{% extends "base.html" %}

{% block title %}Supprimer un billet — LITReview{% endblock %}

{% block content %}
<div class="max-w-xl">
    <h1 class="text-3xl font-bold mb-4">Supprimer « {{ ticket.title }} » ?</h1>

    <p class="font-semibold">
        <span aria-hidden="true">⚠</span> Cette action est définitive.
    </p>

    <form method="post" class="flex justify-end gap-3 mt-6">
        {% csrf_token %}
        <a class="btn" href="{% url 'posts' %}">Annuler</a>
        <button type="submit" class="btn btn-error">Oui, supprimer</button>
    </form>
</div>
{% endblock %}
