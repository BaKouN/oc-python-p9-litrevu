{% extends "base.html" %}

{% block title %}Modifier un billet — LITReview{% endblock %}

{% block content %}
<h1>Modifier « {{ ticket.title }} »</h1>

{% if ticket.image %}
<p>Image actuelle :</p>
<img class="post-image" src="{{ ticket.image.url }}" alt="Couverture actuelle de {{ ticket.title }}">
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
</form>
{% endblock %}
