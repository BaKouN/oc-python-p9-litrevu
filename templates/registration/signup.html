{% extends "base.html" %}

{% block title %}Inscription — LITReview{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-3xl font-bold mb-6">Inscription</h1>

    <form method="post" class="card bg-base-100 border border-base-300">
        <div class="card-body">
            {% csrf_token %}
            {% include "reviews/snippets/form_fields.html" with form=form %}

            <div class="flex justify-end gap-3 mt-4">
                <a class="btn" href="{% url 'login' %}">Retourner</a>
                <button type="submit" class="btn btn-primary">S'inscrire</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
